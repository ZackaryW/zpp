version: 1
commands:
  bdd:
    provider:
      kind: nx
      target: bdd
      args: [--outputStyle=stream]
    targets:
      core:
        value: zpp-core-bdd
        paths:
          - features/core/**
          - features/support/**
          - .nx/nxw.js
          - .python-version
          - nx
          - nx.bat
          - nx.json
          - pyproject.toml
          - scripts/run_behave_roots.py
          - uv.lock
          - zpp.behave.yaml
          - src/zpp/cli/application.py
          - src/zpp/cli/behavior.py
          - src/zpp/cli/global_commands.py
          - src/zpp/cli/initialization.py
          - src/zpp/cli/local.py
          - src/zpp/cli/profile.py
          - src/zpp/cli/resolution.py
          - src/zpp/cli/saved.py
          - src/zpp/cli/shared.py
          - src/zpp/cli/updating.py
          - src/zpp/core/errors.py
          - src/zpp/core/resolution.py
          - src/zpp/core/state.py
          - src/zpp/core/updating.py
          - src/zpp/utils/behavior_*.py
          - src/zpp/utils/default_profile_upgrade.py
          - src/zpp/utils/nx_provider.py
          - src/zpp/utils/processes.py
          - src/zpp/utils/trait_*.py
          - src/zpp/utils/plugin_*.py
      workflow:
        value: zpp-workflow-bdd
        paths:
          - features/workflow/**
          - features/support/**
          - .gitignore
          - .nx/nxw.js
          - .python-version
          - nx
          - nx.bat
          - nx.json
          - pyproject.toml
          - scripts/run_behave_roots.py
          - uv.lock
          - zpp.behave.yaml
          - src/zpp/cli/updating.py
          - src/zpp/cli/workflow.py
          - src/zpp/core/skills.py
          - src/zpp/core/updating.py
          - src/zpp/utils/agent_*.py
          - src/zpp/utils/openspec_*.py
          - src/zpp/utils/skill_*.py
          - src/zpp/artifacts/skills/**
          - src/zpp/artifacts/profiles/default/**
      codespaces:
        value: zpp-codespaces-bdd
        paths:
          - features/codespaces/**
          - features/support/**
          - .nx/nxw.js
          - .python-version
          - nx
          - nx.bat
          - nx.json
          - pyproject.toml
          - scripts/run_behave_roots.py
          - uv.lock
          - zpp.behave.yaml
          - src/zpp/cli/codespace.py
          - src/zpp/core/codespaces.py
          - src/zpp/utils/codespace_*.py
  bdd-audit:
    provider:
      kind: nx
      target: bdd
      args: [--skip-nx-cache, --outputStyle=stream]
    targets:
      core:
        value: zpp-core-bdd
        paths: ["**"]
      workflow:
        value: zpp-workflow-bdd
        paths: ["**"]
      codespaces:
        value: zpp-codespaces-bdd
        paths: ["**"]
