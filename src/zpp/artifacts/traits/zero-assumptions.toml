[meta]
selection = "first-win"
activation = "always-run"

[[trait]]
[trait.content]
body = """Preserve current specifications, accepted intent, and repository evidence. When they leave an outcome-changing product policy, serialization, constraint, or owner boundary unresolved, expose that decision to its owner instead of inventing an answer. This guidance performs no mutation, callback selection, skill invocation, or decision on the owner's behalf."""
