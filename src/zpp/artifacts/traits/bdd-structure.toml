[meta]
selection = "extend"

[[trait]]
[trait.facet]
language = "python"
[[trait.when]]
workspace_contains = "behave.ini"
[[trait.when]]
workspace_contains = ".behaverc"
[[trait.when]]
workspace_contains = "features/*/steps/bindings.py"
[trait.content]
body = """Use the established Behave layout: feature declarations in `.feature` files, shared Python lifecycle helpers in the repository's support package, environment hooks in `environment.py`, and bindings in the established steps modules. Leave provider selection to explicit behavior configuration."""

[[trait]]
[trait.facet]
language = "flutter"
[[trait.when]]
workspace_contains = "integration_test/*.dart"
[[trait.when]]
workspace_contains = "integration_test/**/*.dart"
[trait.content]
body = """Use the repository's established SDK `test` and `integration_test` directories, fixture helpers, and platform setup. Do not require Gherkin or copy Python module names."""

[[trait]]
[trait.facet]
language = "typescript"
[[trait.when]]
workspace_contains = "cucumber.js"
[[trait.when]]
workspace_contains = "cucumber.cjs"
[[trait.when]]
workspace_contains = "cucumber.mjs"
[[trait.when]]
workspace_contains = "cucumber.yml"
[[trait.when]]
workspace_contains = "**/steps/*.ts"
[trait.content]
body = """Use the established TypeScript runner's feature, step-definition, world, hook, and support-module layout without copying Python module names or selecting a verification provider."""
