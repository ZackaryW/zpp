[meta]
selection = "extend"

[[trait]]
[trait.facet]
language = "python"
[[trait.when]]
workspace_contains = "behave.ini"
[[trait.when]]
workspace_contains = ".behaverc"
[[trait.when]]
workspace_contains = "features/*/steps/bindings.py"
[trait.content]
body = """Prescribe one independently runnable `features/<capability>/` root. It owns `<capability>.feature`, an `environment.py` that delegates shared scenario lifecycle, a `support.py` verification entry point, and thin bindings under `steps/bindings.py`. Keep reusable lifecycle and contract execution under `features/support/`. Preserve capability-local declarations and entry points, and leave Nx, Go Task, argv, or other provider selection to explicit behavior configuration."""

[[trait]]
[trait.facet]
language = "flutter"
[[trait.when]]
workspace_contains = "integration_test/*.dart"
[[trait.when]]
workspace_contains = "integration_test/**/*.dart"
[trait.content]
body = """Use established SDK `test` and `integration_test` layouts with capability-cohesive declarations, local thin public-system fixtures, explicit shared support, and independently runnable capability roots. Do not require Gherkin or copy Python module names."""

[[trait]]
[trait.facet]
language = "typescript"
[[trait.when]]
workspace_contains = "cucumber.js"
[[trait.when]]
workspace_contains = "cucumber.cjs"
[[trait.when]]
workspace_contains = "cucumber.mjs"
[[trait.when]]
workspace_contains = "cucumber.yml"
[[trait.when]]
workspace_contains = "**/steps/*.ts"
[trait.content]
body = """Use the established TypeScript runner layout with capability-cohesive declarations, capability-local thin public-system bindings, and explicit reusable support. Keep each capability independently runnable without copying Python module names or selecting a verification provider."""
