[meta]
selection = "first-win"

[[trait]]
[trait.facet]
language = "python"
[[trait.when]]
workspace_contains = "pyproject.toml"
[[trait.when]]
workspace_contains = "setup.py"
[[trait.when]]
workspace_contains = "setup.cfg"
[trait.content]
body = """Check the lock, supported interpreter, lint and format gates, tests, and a clean package build through the declared build backend."""
