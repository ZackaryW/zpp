[meta]
selection = "first-win"

[[trait]]
[trait.facet]
dependency_policy = "proportionate"
[[trait.when]]
workspace_contains = "pyproject.toml"
[[trait.when]]
workspace_contains = "package.json"
[[trait.when]]
workspace_contains = "pubspec.yaml"
[[trait.when]]
workspace_contains = "go.mod"
[[trait.when]]
workspace_contains = "Cargo.toml"
[trait.content]
body = """Apply the Ponytail ladder in order: confirm need, reuse, standard library, native platform, installed dependency, then minimum code. When a confirmed non-trivial responsibility survives those rungs, compare maintained third-party packages by maturity, integration cost, and the proportion of their surface needed. Use no universal percentage threshold."""
