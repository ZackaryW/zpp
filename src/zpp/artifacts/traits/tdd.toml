[meta]
selection = "extend"

[[trait]]
[trait.facet]
language = "python"
[[trait.when]]
workspace_contains = "pyproject.toml"
[[trait.when]]
workspace_contains = "setup.py"
[[trait.when]]
workspace_contains = "setup.cfg"
[trait.content]
body = """Prove a relevant RED, implement the smallest coherent slice, then run focused and complete GREEN verification."""

[[trait]]
[trait.facet]
language = "python"
framework = "django"
[[trait.when]]
workspace_contains = "manage.py"
[[trait.when]]
workspace_contains = "**/settings.py"
[trait.content]
body = """Keep framework setup in test support, exercise public behavior, and avoid production database coupling."""

[[trait]]
[trait.facet]
language = "flutter"
[[trait.when]]
workspace_contains = "pubspec.yaml"
[trait.content]
body = """Use SDK test surfaces, isolate platform boundaries, and verify focused tests before the complete suite."""

[[trait]]
[trait.facet]
language = "typescript"
[[trait.when]]
workspace_contains = "tsconfig.json"
[[trait.when]]
workspace_contains = "**/tsconfig.json"
[trait.content]
body = """Use the repository's package manager and runner, prove the failure, implement, then run focused and complete checks."""
