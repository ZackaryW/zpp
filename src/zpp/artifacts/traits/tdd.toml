[meta]
selection = "extend"

[[trait]]
[trait.facet]
language = "python"
[[trait.when]]
workspace_contains = "pyproject.toml"
[[trait.when]]
workspace_contains = "setup.py"
[[trait.when]]
workspace_contains = "setup.cfg"
[trait.content]
body = """Use the repository's established Python test runner, fixture conventions, and focused-test selectors."""

[[trait]]
[trait.facet]
language = "python"
framework = "django"
[[trait.when]]
workspace_contains = "manage.py"
[[trait.when]]
workspace_contains = "**/settings.py"
[trait.content]
body = """Use the repository's established Django test setup and database-isolation conventions."""

[[trait]]
[trait.facet]
language = "flutter"
[[trait.when]]
workspace_contains = "pubspec.yaml"
[trait.content]
body = """Use the repository's established Flutter SDK test surfaces and platform-test fixtures."""

[[trait]]
[trait.facet]
language = "typescript"
[[trait.when]]
workspace_contains = "tsconfig.json"
[[trait.when]]
workspace_contains = "**/tsconfig.json"
[trait.content]
body = """Use the repository's established TypeScript package manager, test runner, and focused-test selectors."""
