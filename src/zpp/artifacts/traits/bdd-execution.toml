[meta]
selection = "first-win"

[[trait]]
[trait.facet]
bdd_mode = "manual"
[trait.content]
body = """Pause before selecting or invoking a BDD command. This mode does not convert a failed or insufficient command or an unsatisfied shaped BDD obligation into success and grants no callback, staging, commit, merge, rebase, or reconciliation authority."""

[[trait]]
[trait.facet]
bdd_mode = "disabled"
[trait.content]
body = """Omit BDD only when another established relevant verification surface exists and no accepted shaped BDD obligation remains unsatisfied; record that alternate evidence. This mode does not convert a failed or insufficient command into success and grants no callback, staging, commit, merge, rebase, or reconciliation authority."""

[[trait]]
[trait.facet]
bdd_mode = "complete"
[trait.content]
body = """Apply this mode before any optional repository gate. Run every declared target with `--all`. This trait never carries or authors repository gate bindings or target identities, cannot bypass failed or insufficient verification, and grants no callback, staging, commit, merge, rebase, or reconciliation authority."""

[[trait]]
[trait.facet]
bdd_mode = "targeted"
[trait.content]
body = """Apply this mode before any optional repository gate. When the selected command declares a gate matching the owning packaged skill identity, request it with `--gate`; otherwise run deterministic affected selection without `--all`. This trait never carries or authors repository gate bindings or target identities, cannot bypass failed or insufficient verification, and grants no callback, staging, commit, merge, rebase, or reconciliation authority."""

[[trait]]
[trait.content]
body = """Use targeted BDD verification by default. Apply this mode before any optional repository gate: when the selected command declares a gate matching the owning packaged skill identity, request it with `--gate`; otherwise run deterministic affected selection without `--all`. This global or inherited trait never carries or authors repository gate bindings or target identities. It cannot convert failed or insufficient verification or an unsatisfied shaped BDD obligation into success and grants no callback, staging, commit, merge, rebase, or reconciliation authority."""
