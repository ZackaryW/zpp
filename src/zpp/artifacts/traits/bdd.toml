[meta]
selection = "extend"

[[trait]]
[trait.facet]
language = "python"
[[trait.when]]
workspace_contains = "behave.ini"
[[trait.when]]
workspace_contains = ".behaverc"
[[trait.when]]
workspace_contains = "features/*/steps/bindings.py"
[trait.content]
body = """Use the repository's established Behave runner, fixture conventions, and Python context model. Compose reusable lifecycle support without replacing capability-local declarations or bindings."""

[[trait]]
[trait.facet]
language = "flutter"
[[trait.when]]
workspace_contains = "integration_test/*.dart"
[[trait.when]]
workspace_contains = "integration_test/**/*.dart"
[trait.content]
body = """Use the established Flutter integration-test runner and SDK fixture conventions without imposing Gherkin or a Python filesystem shape."""

[[trait]]
[trait.facet]
language = "typescript"
[[trait.when]]
workspace_contains = "cucumber.js"
[[trait.when]]
workspace_contains = "cucumber.cjs"
[[trait.when]]
workspace_contains = "cucumber.mjs"
[[trait.when]]
workspace_contains = "cucumber.yml"
[[trait.when]]
workspace_contains = "**/steps/*.ts"
[trait.content]
body = """Use the repository's selected TypeScript BDD runner, world, hooks, and fixture conventions without imposing Python layouts."""
