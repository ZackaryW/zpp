[project]
name = "zpp"
version = "0.9.0"
description = "Zack's Project Protocol"
authors = [
    { name = "ZackaryW", email = "gitzackw@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13,<3",
    "PyYAML>=6.0.3",
    "questionary>=2.1,<3",
    "typer>=0.12",
]

[project.scripts]
zpp = "zpp.cli:app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "pytest>=8",
]
