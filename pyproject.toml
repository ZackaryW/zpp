[project]
name = "zpp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ZackaryW", email = "gitzackw@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agent-router @ git+https://github.com/ZackaryW/agent-router.git@1449a589f012305f47c594211bbaba6ab28eb8ba",
    "openlease @ git+https://github.com/ZackaryW/openlease.git@f9416008fa2d2d6413288d3644fc1345060c75b7",
    "pydantic>=2.13,<3",
    "typer>=0.27,<1",
]

[dependency-groups]
dev = [
    "behave>=1.3.3,<2",
    "pytest>=9,<10",
    "ruff>=0.12",
]

[project.scripts]
zpp = "zpp:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
