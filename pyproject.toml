[project]
name = "zpp"
version = "2.1.3"
description = "Repository-oriented workflow traits for coding agents"
readme = "README.md"
authors = [
    { name = "ZackaryW", email = "gitzackw@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agent-router @ git+https://github.com/ZackaryW/agent-router.git@9c7984f25c1809a4a9245a746d0c741e3e3eb180",
    "openspec-bundler @ git+https://github.com/ZackaryW/openspec-bundler.git@63cb9851931b9d242abf8abf75565c34cc2b3779",
    "pydantic>=2.13,<3",
    "pyyaml>=6,<7",
    "questionary>=2.1,<3",
    "tomli-w>=1.2,<2",
    "typer>=0.27,<1",
]

[dependency-groups]
dev = [
    "behave>=1.3.3,<2",
    "pytest>=9,<10",
    "ruff>=0.12",
]

[project.scripts]
zpp = "zpp.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
